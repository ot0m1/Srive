services:
  nextjs-app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      # A bind mount from the host does not deliver inotify events into the
      # container, so next dev never sees an edit and silently serves stale
      # code. Polling is the only thing that picks changes up here.
      - WATCHPACK_POLLING=true
    command: npm run dev
